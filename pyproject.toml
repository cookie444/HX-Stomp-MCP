[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hx-mcp"
version = "0.1.0"
description = "MCP server for controlling a Line 6 HX Stomp over its USB vendor protocol"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pyusb>=1.2.1",
    "msgpack>=1.0.0",
    "libusb-package>=1.0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hx-stomp-mcp = "server:main"

[tool.setuptools]
packages = ["hx_mcp", "hx_mcp.protocol", "hx_mcp.transport", "hx_mcp.files", "hx_mcp.tools"]
py-modules = ["server", "probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
