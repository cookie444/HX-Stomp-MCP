# Zadig preset device — loaded via "Device -> Load Preset Device..."
# Pins the target to the HX Stomp vendor control interface, so the audio
# (MI_01) and HID (MI_05) interfaces cannot be selected by mistake.
[device]
  Description = "HX Stomp (MI_00 vendor control)"
  VID = 0x0E41
  PID = 0x4246
  MI = 0x00
